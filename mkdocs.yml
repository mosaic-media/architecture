markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  # Mermaid diagrams render natively through Material's superfences.
  # A ```mermaid block becomes a rendered diagram; no plugin required.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - path: assets/js/mermaid-init.js
    type: module

plugins:
  - search
