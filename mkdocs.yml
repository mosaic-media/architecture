site_name: Mosaic
site_description: Mosaic architecture and direction.
site_url: https://mosaic-media.github.io/architecture/

repo_name: mosaic-media/architecture
repo_url: https://github.com/mosaic-media/architecture
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/mosaic-icon-dark.png
  favicon: assets/mosaic-icon-dark.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

