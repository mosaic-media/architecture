name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site and PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium for PDF rendering
        run: python -m playwright install --with-deps chromium

      # Both run before the site build, because `mkdocs --strict` validates a
      # link only while both ends live in `docs/` — it stops helping exactly
      # when records start moving to the repositories that own them.
      - name: Check the decision-record index is not stale
        run: python scripts/adr_index.py --repo architecture --check

      # A ratchet, not a target: the ceiling is today's count and is lowered as
      # records move. It can only go down.
      - name: Check every record citation names its repository
        run: |
          python scripts/adr_lint.py --repo architecture \
            --max-unqualified 1671 \
            --exclude adr-migration-audit.md --exclude 'scripts/adr_*.py'

      - name: Build site
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict

      - name: Build PDFs
        run: python scripts/build_pdfs.py

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
