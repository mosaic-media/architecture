site_name: Mosaic
site_description: Mosaic architecture and direction.
site_url: https://mosaic-media.github.io/architecture/

repo_name: mosaic-media/architecture
repo_url: https://github.com/mosaic-media/architecture
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/mosaic-icon-dark.png
  favicon: assets/mosaic-icon-dark.png
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Mosaic: index.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Unreachable capability: unreachable-capability.md
  - Decisions:
      - Index: adr/README.md
      - "1. Licensing": adr/0001-licensing.md
      - "2. Repository names encode role, not the org — drop the redundant prefix": adr/0002-repository-naming-convention.md
      - "3. Two module tiers": adr/0003-two-module-tiers.md
      - "4. Official builds carry project credentials, and a personal key replaces one": adr/0004-project-credentials-in-official-builds.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  # Mermaid diagrams render natively through Material's superfences.
  # A ```mermaid block becomes a rendered diagram; no plugin required.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - path: assets/js/mermaid-init.js
    type: module

plugins:
  - search
